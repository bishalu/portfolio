<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="bishal.ai">
  <title>bishal.ai</title>
  <!--
    A lowercase b in two pieces, with a pulse running through the seam.

    The letter is built from primitives rather than drawn: a stem and a ring,
    both 66 units thick, so the weight is identical everywhere. A band of the
    background colour cuts horizontally through the exact centre, which is what
    separates the upper form (stem and arch) from the lower one (the bowl).
    Cutting the gap with the ground rather than authoring two closed paths keeps
    the geometry honest — the two forms are provably the same shapes, minus a
    rectangle.

    Through that seam runs one continuous line: flat, one symmetrical peak at
    centre, flat again. It is the same reading the hero's oscilloscope draws and
    the same shape the spike-train rail on the publications uses.

    The mark spans 90 → 422 on both axes: 332 units, 65% of the canvas, equal
    margin on all four sides.

    Three colours and nothing else. No gradient here, unlike everywhere else on
    the site — at 16px a two-stop ramp across a 30-unit stroke resolves to one
    muddy colour, so the flat marigold is both the brief and the better call.
  -->
  <rect width="512" height="512" fill="#0E1124" />

  <g fill="#FAF7F1">
    <rect x="90" y="90" width="66" height="332" rx="10" />
    <path
      fill-rule="evenodd"
      d="M142 282 a140 140 0 1 1 280 0 a140 140 0 1 1 -280 0 Z
         M208 282 a74 74 0 1 0 148 0 a74 74 0 1 0 -148 0 Z"
    />
  </g>

  <!-- The seam. Background colour, full width of the mark, centred on 256. -->
  <rect x="70" y="232" width="380" height="48" fill="#0E1124" />

  <path
    d="M78 256 H198 L256 168 L314 256 H434"
    fill="none"
    stroke="#EFA33B"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

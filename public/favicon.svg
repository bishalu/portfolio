<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="bishal.ai">
  <title>bishal.ai</title>
  <!--
    One stroke, doing both jobs: it is a trace and it is the b.

    The line rests, spikes to the ascender, falls down the stem, and rounds
    into the bowl — an action potential that happens to spell the first letter
    of the name. The site is an instrument reading a signal (the hero
    oscilloscope, the spike-train rail on the publications, the sig-* motion
    vocabulary, a neuroscience record of recording electrical signals in living
    circuits), so the mark is that, reduced until it survives 16px.

    The flat lead-in on the left is what keeps it from being a plain letter: it
    is the resting baseline the spike departs from. Without it this is a "b";
    with it, it is a reading.

    The bowl is drawn wider than a typeface would draw it. At 16px a normal
    counter closes up and the glyph becomes a blob, and an open counter is the
    whole difference between a letter and a smudge.
  -->
  <defs>
    <linearGradient id="signal" x1="84" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d64553" />
      <stop offset="1" stop-color="#efa33b" />
    </linearGradient>
  </defs>
  <!-- The tile carries its own field, so the mark holds on a light tab strip
       as well as a dark one. --void, the site's deepest surface. -->
  <rect width="512" height="512" rx="112" fill="#0e1124" />
  <path
    d="M84 270 H152 L204 96 L226 414 C492 414 492 196 226 220"
    fill="none"
    stroke="url(#signal)"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

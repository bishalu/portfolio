<!doctype html>
<!--
  Static form registry for Netlify Forms. Because this site server-renders
  some routes, Netlify's build-time form detection can miss forms in dynamic
  pages. Listing them here guarantees they are registered so submissions are
  captured and email notifications fire.

  Field names must match the visible form exactly — a name registered here and
  not present in the real form is silently discarded on submit. `quick-contact`
  registered `name` while CloseSection.astro has always submitted `firstname`,
  so every contact email arrived with an empty name; fixed below.

    - quick-contact     : the visible homepage contact form (CloseSection.astro)
    - balgo-lead        : client/employer intent forwarded by the Balgo chat API
    - naam-suggestion   : the visible suggestion form on /naam. `picks` is the
                          JSON tray (JS only) and `names` is free text, which is
                          how the form still carries a name with JS off.
    - naam-approve-link : posted server-side by /api/naam-submit so the
                          notification carries a one-click approve link. It is
                          a separate form because the visitor's own submission
                          must stay exactly the five fields the page shows.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
  </head>
  <body>
    <form name="quick-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="firstname" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <form name="balgo-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <textarea name="message"></textarea>
      <textarea name="reply"></textarea>
    </form>

    <form name="naam-suggestion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="from" />
      <input type="text" name="relation" />
      <input type="text" name="picks" />
      <input type="text" name="names" />
      <textarea name="reason"></textarea>
    </form>

    <form name="naam-approve-link" data-netlify="true" hidden>
      <input type="text" name="from" />
      <input type="text" name="relation" />
      <input type="text" name="picks" />
      <textarea name="reason"></textarea>
      <input type="text" name="approve" />
    </form>
  </body>
</html>
